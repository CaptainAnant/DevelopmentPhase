<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ClasSync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container-fluid d-flex justify-content-center align-items-center vh-100">
        <div class="auth-container">
            <h1 class="logo-text mb-4">ClasSync</h1>

            <div class="toggle-buttons">
                <button id="studentBtn" class="toggle-btn active" onclick="showForm('student')">Student</button>
                <button id="adminBtn" class="toggle-btn" onclick="showForm('admin')">Admin</button>
            </div>

            <form id="student-form" class="auth-form">
                <div class="form-group mb-3">
                    <label for="studentEmail">Student Email</label>
                    <input type="email" class="form-control" id="studentEmail" placeholder="Enter your email">
                </div>
                <div class="form-group mb-3">
                    <label for="studentRollNo">Roll No</label>
                    <input type="text" class="form-control" id="studentRollNo" placeholder="e.g., 22ABC001">
                </div>
                <div class="form-group mb-4">
                    <label for="studentPassword">Password</label>
                    <input type="password" class="form-control" id="studentPassword" placeholder="Enter your password">
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>

            <form id="admin-form" class="auth-form" style="display: none;">
                <div class="form-group mb-3">
                    <label for="adminId">Admin ID</label>
                    <input type="text" class="form-control" id="adminId" placeholder="Enter your Admin ID">
                </div>
                <div class="form-group mb-4">
                    <label for="adminPassword">Password</label>
                    <input type="password" class="form-control" id="adminPassword" placeholder="Enter your password">
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>

            <div class="text-center mt-4">
                <p class="secondary-text">Don't have an account? <a href="signup.html">Sign Up</a></p>
            </div>
        </div>
    </div>

    <script>
        function showForm(formType) {
            const studentForm = document.getElementById('student-form');
            const adminForm = document.getElementById('admin-form');
            const studentBtn = document.getElementById('studentBtn');
            const adminBtn = document.getElementById('adminBtn');

            if (formType === 'student') {
                studentForm.style.display = 'block';
                adminForm.style.display = 'none';
                studentBtn.classList.add('active');
                adminBtn.classList.remove('active');
            } else {
                studentForm.style.display = 'none';
                adminForm.style.display = 'block';
                studentBtn.classList.remove('active');
                adminBtn.classList.add('active');
            }
        }
    </script>

</body>
</html>
