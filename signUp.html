<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF--8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - ClasSync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="loginSignUpStyle.css">
</head>
<body>

    <div class="container-fluid d-flex justify-content-center align-items-center vh-100">
        <div class="auth-container">
            <h1 class="logo-text mb-2">ClasSync</h1>
            <p class="text-center secondary-text mb-4">Create a new account</p>

            <div class="toggle-buttons">
                <button id="studentBtn" class="toggle-btn active" onclick="showForm('student')">Student Sign Up</button>
                <!-- <button id="adminBtn" class="toggle-btn" onclick="showForm('admin')">Admin Sign Up</button> -->
            </div>

            <form id="student-form" class="auth-form">
                <div class="form-group mb-3">
                    <input type="text" class="form-control" placeholder="Full Name">
                </div>
                <div class="form-group mb-3">
                    <input type="email" class="form-control" placeholder="Student Email">
                </div>
                <div class="form-group mb-3">
                    <input type="tel" class="form-control" placeholder="Phone Number">
                </div>
                <div class="form-group mb-3">
                    <input type="text" class="form-control" placeholder="Roll Number">
                </div>
                <div class="form-group mb-3">
                    <input type="text" class="form-control" placeholder="Institute Name">
                </div>
                <div class="form-group mb-4">
                    <input type="password" class="form-control" placeholder="Set Password">
                </div>
                <button type="submit" class="btn btn-primary w-100">Create Account</button>
            </form>

            <!-- <form id="admin-form" class="auth-form" style="display: none;">
                 <div class="form-group mb-3">
                    <input type="email" class="form-control" placeholder="Admin Email">
                </div>
                <div class="form-group mb-3">
                    <input type="tel" class="form-control" placeholder="Phone Number">
                </div>
                <div class="form-group mb-3">
                    <input type="text" class="form-control" placeholder="Institute Name">
                </div>
                 <div class="form-group mb-4">
                    <input type="password" class="form-control" placeholder="Set Password">
                </div>
                <button type="submit" class="btn btn-primary w-100">Create Admin Account</button>
            </form> -->

            <div class="text-center mt-4">
                <p class="secondary-text">Already have an account? <a href="login.html">Login</a></p>
            </div>
        </div>
    </div>

    <script>
        // Same script as login.html
        function showForm(formType) {
            const studentForm = document.getElementById('student-form');
            const adminForm = document.getElementById('admin-form');
            const studentBtn = document.getElementById('studentBtn');
            const adminBtn = document.getElementById('adminBtn');

            if (formType === 'student') {
                studentForm.style.display = 'block';
                adminForm.style.display = 'none';
                studentBtn.classList.add('active');
                adminBtn.classList.remove('active');
            } else {
                studentForm.style.display = 'none';
                adminForm.style.display = 'block';
                studentBtn.classList.remove('active');
                adminBtn.classList.add('active');
            }
        }
    </script>

</body>
</html>
